   # ============================================================
   # 博客自动构建 & 部署（双分支方案）
   # main:    源码（posts/*.md、publish.py、模板、assets）
   # gh-pages:编译产物（仅静态网页），GitHub Pages 服务此分支
   # 仓库 Settings → Pages → Source 选择 gh-pages 分支
   # ============================================================
   name: Build & Deploy

   on:
     push:
       branches: [main]
       paths:
         - 'posts/**'
         - 'publish.py'
         - 'post-template.html'
     workflow_dispatch:        # 支持手动触发

   permissions:
     contents: write

   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Python
           uses: actions/setup-python@v5
           with:
             python-version: '3.11'

         - name: Rebuild site from posts/
           run: python publish.py --rebuild

         - name: Deploy to GitHub Pages (gh-pages)
           uses: peaceiris/actions-gh-pages@v4
           with:
             github_token: ${{ secrets.GITHUB_TOKEN }}
             publish_dir: ./
             force_orphan: true
             exclude_assets: '.github,posts,publish.py,post-template.html,README.md'
